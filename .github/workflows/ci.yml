name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: languages/rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: languages/rust
      - run: cargo test --release
      - run: cargo build --release --bin fp16_semantics
      - run: cargo run --release --bin simd-lab-rust


  rust-miri:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: languages/rust
      - working-directory: languages/rust
        run: cargo miri setup
      - working-directory: languages/rust
        run: cargo miri test --lib

  cpp-sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure ASan and UBSan
        run: >
          cmake -S languages/cpp -B build/cpp-sanitizers
          -DCMAKE_BUILD_TYPE=Debug
          -DSIMD_LAB_CPU=baseline
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build correctness target
        run: cmake --build build/cpp-sanitizers --config Debug --target simd_lab_cpp -j2
      - name: Run C++ smoke test
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build/cpp-sanitizers --build-config Debug --output-on-failure
  cpp:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ hashFiles('languages/cpp/**') }}
          restore-keys: ccache-${{ runner.os }}-
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ccache
      - if: runner.os == 'Linux'
        run: cmake -S languages/cpp -B build/cpp -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - if: runner.os == 'Windows'
        run: cmake -S languages/cpp -B build/cpp
      - run: cmake --build build/cpp --config Release --target simd_lab_cpp -j2
      - run: ctest --test-dir build/cpp --build-config Release --output-on-failure

  zig:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/zig
            languages/zig/.zig-cache
          key: zig-${{ runner.os }}-${{ hashFiles('languages/zig/**') }}
          restore-keys: zig-${{ runner.os }}-
      - working-directory: languages/zig
        run: zig build test -Doptimize=ReleaseSafe
      - working-directory: languages/zig
        run: zig build test -Doptimize=ReleaseFast
      - working-directory: languages/zig
        run: zig build -Doptimize=ReleaseFast
      - working-directory: languages/zig
        run: zig build run -Doptimize=ReleaseFast
  benchmark-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - working-directory: languages/rust
        run: cargo build --release --bin bench
      - run: cmake -S languages/cpp -B build/cpp-bench -DCMAKE_BUILD_TYPE=Release -DSIMD_LAB_CPU=baseline
      - run: cmake --build build/cpp-bench --config Release --target simd_lab_cpp_bench -j2
      - working-directory: languages/zig
        run: zig build-exe src/bench.zig -O ReleaseFast -femit-bin=/tmp/simd-lab-zig-bench

  codegen-x86:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: languages/rust
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: python3 scripts/generate_codegen_snapshots.py --target x86-64-v3
      - run: python3 scripts/check_codegen_regressions.py results/codegen/known-good/manifest-x86-64-v3.json results/codegen/manifest-x86-64-v3.json --policy codegen-policy.json
      - uses: actions/upload-artifact@v4
        with:
          name: codegen-x86-64-v3
          path: results/codegen/

  codegen-cross:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        profile: [aarch64-neon, wasm-simd128]
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: actions/cache@v4
        with:
          path: ~/.cache/zig
          key: zig-codegen-${{ matrix.profile }}-${{ hashFiles('probes/zig/**') }}
          restore-keys: zig-codegen-${{ matrix.profile }}-
      - run: python3 scripts/generate_cross_codegen.py --target ${{ matrix.profile }}
      - uses: actions/upload-artifact@v4
        with:
          name: codegen-${{ matrix.profile }}
          path: results/codegen/
